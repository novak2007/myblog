<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Публікації</title>
</head>
<body>
    <h2>Публікації {% if category %} - {{ category }} {% endif %}</h2>
    <hr>

    {% for item in items %}
    <div class="articles-row">
        <a href="{{ item.get_absolute_url }}">
            <h4>{{ item.title }}</h4>
        </a>
        <h5>{{ item.pub_date|date:"j E Y"|safe|linebreaks }}</h5>
        <p>{{ item.description|safe|escape|striptags|truncatewords_html:32 }}</p>
    </div>
    <hr>
    {% endfor %}

    <a href="{% url 'home' %}">Повернутися на головну</a>
</body>
</html>
